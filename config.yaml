# I Love You Mirror — Configuration (V2 / jetson-v2-prep)
# ---------------------------------------------------------

# Operating mode: "live", "fallback", "hybrid"
mode: hybrid
response_mode: layered   # "layered" or "single"

# Wake-word detection backend: "simulate", "vosk", "porcupine"
wake_detector: vosk

# Audio input
audio:
  sample_rate: 16000
  channels: 1
  format: int16
  pre_detection_buffer_sec: 4.0
  post_detection_sec: 2.0     # legacy fixed-duration fallback
  # PortAudio device indices (re-probed 2026-05-14 on new 64GB card):
  #   1 = USB Lavalier Microphone (hw:1,0, native 44100Hz, in×1)
  #   0 = AB13X USB Audio (hw:0,0, native 48000Hz, out×2)
  # AudioInput / Playback auto-detect each device's native rate and resample
  # to/from the pipeline rate (16000Hz). Set null to use system default.
  input_device: 1
  output_device: 0
  # Adaptive capture — keep recording until end-of-utterance silence
  adaptive_capture:
    enabled: true
    min_post_sec: 1.0         # always capture at least this much
    max_post_sec: 5.0         # hard ceiling regardless of speech
    eos_silence_rms: 0.012    # below this counts as silence (0.008→0.012 — most clips were 7-9s due to trailing room noise; tighter cut trims to actual speech length)
    eos_silence_sec: 0.4      # trailing silence required to stop (0.7→0.4 — faster cutoff so EOS trips before max_post_sec)

# Volume / quality thresholds
thresholds:
  intimate_rms: 0.005
  strong_rms: 0.02
  noise_floor_rms: 0.002
  max_clipping_ratio: 0.05
  min_duration_sec: 0.8
  max_duration_sec: 6.5       # was 5.0 — DEVLOG #4 noted clips were 6.05s with adaptive capture this can shrink again

# Quality gate
quality:
  save_threshold: 0.4
  unusable_threshold: 0.15

# Memory store
memory:
  max_clips: 1000
  live_dir: audio/live/i_love_you
  live_dir_too: audio/live/i_love_you_too
  fallback_dir: audio/fallback/i_love_you
  fallback_dir_too: audio/fallback/i_love_you_too
  state_file: state.json
  # Eviction: "diversity" (keeps rare emotion vectors) or "fifo"
  eviction_policy: diversity
  evict_weight_score: 0.45
  evict_weight_similarity: 0.35
  evict_weight_age: 0.20

# Keyword buckets — what phrases trigger what responses.
# Buckets are checked HIGHEST priority first; the first hit wins, so more
# specific phrases (e.g. "I love you Sandy") must outrank shorter ones.
#
# Each bucket:
#   id:                       short stable id; also used as filename prefix
#   patterns:                 literal phrase variants (lowercase)
#   slang:                    single-token slang forms (matched as whole words)
#   priority:                 higher = checked first
#   anchor_extra:             extra word(s) that MUST appear (in addition to
#                             the universal love-word anchor) — e.g. "sandy"
#                             so "I love you Sandy" matches but "I love you"
#                             alone does not match this bucket.
#   live_dir / fallback_dir:  where user/fallback recordings live (auto-created)
#   save_user_recordings:     if false, never persist user recordings here
#                             (used for memorial / specific-voice buckets)
#   response_files_only:      if true, response is single random fallback from
#                             this bucket — never layers user recordings in.
phrases:
  buckets:
    # "I love you Sandy" — highest priority, anchored by the word "sandy".
    # Responses come ONLY from this bucket's fallback dir; user recordings
    # of this phrase are NOT saved (no random voices polluting Sandy's pool).
    - id: ily_sandy
      priority: 30
      patterns:
        - "i love you sandy"
        - "i love u sandy"
        - "i love ya sandy"
      anchor_extra: [sandy]
      live_dir: audio/live/i_love_you_sandy
      fallback_dir: audio/fallback/i_love_you_sandy
      # Collect "I love you Sandy" recordings to the live dir for future use
      # but DON'T play them back yet — response_files_only=true keeps Sandy
      # responses sourced exclusively from the curated fallback dir, and the
      # bucket is auto-isolated (see PhraseMatcher.isolated_bucket_ids) so
      # these clips never bleed into the default ily pool either.
      save_user_recordings: true
      response_files_only: true

    # "I love you too" — checked before plain "ily" so it doesn't get swallowed.
    - id: ily_too
      priority: 20
      patterns:
        - "i love you too"
        - "i love u too"
        - "i love you to"
        - "i love u to"
        - "i love ya too"
        - "i love yew too"
      live_dir: audio/live/i_love_you_too
      fallback_dir: audio/fallback/i_love_you_too

    # "Jetson turn a new page" — system command. Short-circuits the pipeline
    # to archive every live clip into a timestamped subdir under its bucket's
    # live_dir and clear state.json so the chorus pool starts fresh. Doesn't
    # touch fallback dirs (Sandy memorial responses stay intact). Highest
    # priority so it wins decisively. anchor_words=[jetson] makes it isolated
    # — never bleeds into any other bucket's pool, never matches accidentally.
    - id: archive_command
      priority: 50
      patterns:
        - "jetson turn a new page"
        - "jetson turn the page"
        - "jetson new page"
      anchor_words: [jetson]
      command: archive_clips
      save_user_recordings: false

    # Companion to archive_command — reads each archive subdir's manifest.json
    # and restores every clip back into its original bucket with full metadata
    # (score, emotion vectors, timestamp). Idempotent: a manifest that's
    # already been consumed is skipped. Filename collisions append __restoredN.
    - id: restore_command
      priority: 50
      patterns:
        - "jetson remember it all"
        - "jetson remember everything"
        - "jetson remember all"
      anchor_words: [jetson]
      command: restore_archives
      save_user_recordings: false

    # "Jetson sleep" / "Jetson wake up" — pause/resume active listening.
    # While asleep the detector and idle lights keep running, but every
    # trigger EXCEPT the wake command is ignored — no chorus, no capture,
    # no other commands. The asleep flag is in-memory ON PURPOSE: a reboot
    # always comes back awake (the requested boot default).
    - id: sleep_command
      priority: 50
      patterns:
        - "jetson sleep"
        - "jetson go to sleep"
        - "jetson stop listening"
      anchor_words: [jetson]
      command: sleep_listening
      save_user_recordings: false

    - id: wake_command
      priority: 50
      patterns:
        - "jetson wake up"
        - "jetson wake"
        - "jetson start listening"
      anchor_words: [jetson]
      command: wake_listening
      save_user_recordings: false

    # "I am a monster" — fully independent of the love family. Uses its own
    # required-anchor word ("monster") instead of the universal love-anchor,
    # so love phrases never route here and monster phrases never route to ily.
    # Saves user recordings and layers like ily — its own growing chorus.
    - id: monster
      priority: 25
      patterns:
        - "i am a monster"
        - "im a monster"
        - "i'm a monster"
        - "i am monster"
        - "i'm monster"
        - "im monster"
        - "i am the monster"
      anchor_words: [monster]
      live_dir: audio/live/i_am_a_monster
      fallback_dir: audio/fallback/i_am_a_monster

    # Default "I love you" bucket — lowest priority, catches everything else.
    - id: ily
      priority: 10
      patterns:
        - "i love you"
        - "i love u"
        - "i love ya"
        - "i love yew"
        - "i loved you"
        - "i loved u"
        - "love you"
        - "love u"
      slang: [ily, iloveyou, iluvu]
      live_dir: audio/live/i_love_you
      fallback_dir: audio/fallback/i_love_you

# ASR backend — "vosk" now, "whisper" once faster-whisper is installed
asr:
  backend: vosk

# Whisper config (used when asr.backend = whisper)
whisper:
  model_size: distil-small.en
  device: cuda
  compute_type: int8_float16
  language: en
  beam_size: 1
  vad_filter: true

# Speaker identification — diarizes the chorus pool so a single voice can't
# dominate a response. Each saved clip is embedded with SpeechBrain's
# ECAPA-TDNN encoder; clips above `similarity_threshold` cosine collapse
# into one speaker_id. Layered responses then take at most one clip per id.
speaker:
  enabled: true
  model: speechbrain/spkrec-ecapa-voxceleb
  # CPU is the safe default on Jetson — ECAPA-TDNN is small (~14M params)
  # and embeds a clip in <200ms on the Orin CPU. Switch to cuda only if you
  # confirm GPU memory headroom alongside Whisper/SER.
  device: cpu
  # Average cosine similarity threshold for grouping clips into one
  # speaker_id at backfill time. We use offline agglomerative average-
  # link clustering plus a centroid-refinement pass, so this is the
  # AVERAGE of all cross-cluster pair sims a cluster must clear (not
  # the min — that would be complete-link, too conservative — nor the
  # max — single-link, prone to chain-collapse). Sandy's two
  # different-phrase clips land at cos=0.636, and a typical user
  # testing burst averages ~0.30–0.35 in pair sim across 5+ clips, so
  # 0.30 captures both while keeping distinct visitor pairs (typical
  # avg <0.15) apart.
  similarity_threshold: 0.30
  savedir: models/speaker_ecapa_voxceleb

# Emotion backend — "prosody" (CPU, no deps) or "wav2vec_ser" (Jetson GPU)
emotion:
  backend: prosody
  # Calibration for prosody backend
  pitch_low_hz: 110.0
  pitch_high_hz: 280.0
  energy_low: 0.005
  energy_high: 0.10
  smoothing: 0.0
  # Response selection: "match" (echo speaker), "contrast", "diverse"
  selection_mode: match
  # For wav2vec_ser backend:
  model: audeering/wav2vec2-large-robust-12-ft-emotion-msp-dim
  device: cuda

# Playback / effects
playback:
  # === Master output stage (last thing before the DAC) ===
  # `master_gain` is the single most important knob for taming exciter
  # distortion. Each step from 1.0 downward gives the exciter more headroom.
  #   1.0  full output (V1 behaviour — can over-drive)
  #   0.7  ~3dB headroom
  #   0.55 ~5dB headroom (default — safe for most surface exciters)
  #   0.4  ~8dB headroom (very quiet, if your room is small)
  master_gain: 0.7
  # Absolute peak ceiling enforced by the brickwall limiter. Tightened to
  # 0.32 to match this exciter's physical clean-output ceiling (probed
  # 2026-05-14: distortion sets in just above peak ≈0.32 with this surface).
  # The brickwall holds peaks below this while the body of the signal
  # keeps the master_gain=0.7 perceived loudness.
  master_ceiling: 0.25
  master_limiter_enabled: true

  max_layers: 10
  # Speaker-dedup chorus selection (V2.1+):
  #   layered_recent_count: this many most-recent DISTINCT speakers are
  #                         pinned into every layered response (deterministic,
  #                         no random selection). For each pinned speaker we
  #                         play their NEWEST clip — it already cleared the
  #                         save-threshold quality gate.
  #   layered_random_count: how many additional distinct speakers are
  #                         uniformly sampled from the rest of the bucket.
  #                         For each random speaker we play their HIGHEST-
  #                         QUALITY clip so the random tail stays polished.
  #                         Combined with recent_count this defines the
  #                         target chorus size — fallback clips top up only
  #                         if the live pool can't reach that many speakers.
  layered_recent_count: 3
  layered_random_count: 5
  # Speakers whose best-quality clip falls below `layered_min_quality` are
  # dropped from the RANDOM pool (pinned slots ignore this — those
  # contributors earned their spot via the save_threshold gate). Save bar
  # is 0.4; setting this higher keeps the random part of the chorus tighter.
  layered_min_quality: 0.5
  # DEPRECATED — preserved for back-compat. The new speaker-dedup chorus
  # uses uniform random selection of distinct speakers; quality weighting
  # happens implicitly via the per-speaker best-clip pick. Adjust
  # layered_min_quality instead if you want to tighten the random pool.
  layered_quality_weight: 1.5
  # Chorus-time embedding dedup. At chorus build time we reject any
  # candidate whose embedding cosine sim ≥ this threshold against the
  # CENTROID of any already-selected speaker's cluster. Comparing
  # against the cluster centroid (mean of all that speaker's clips) is
  # smoother than comparing against a single clip, so it catches more
  # of the "probably same speaker" cases without false-merging distinct
  # voices. Set to 0 to disable.
  chorus_dedup_threshold: 0.30
  # How chorus layer start times are spaced (see effects.layer_onsets).
  #   golden_gaps — every gap is either layer_gap_sec (short) or
  #                 layer_gap_sec×1.618 (long), in a non-repeating golden-
  #                 ratio pattern that never puts two short gaps together.
  #                 Spread grows linearly, so all voices stack up on each
  #                 other: with 8 layers the last voice enters at ~1.7s
  #                 and ~3 voices sound at once on average.
  #   phi_growth  — legacy: start_n = layer_delay_sec × 1.618^(n-1). Grows
  #                 exponentially; with 8 layers the last voice entered at
  #                 5.0s and 63% of the chorus was a single voice alone.
  layer_spacing: golden_gaps
  # golden_gaps: the SHORT gap between two layer starts — also the minimum
  # spacing (before the time-of-day pace: ×0.9 morning … ×1.25 night).
  # 0.16 keeps the tightest gap (~0.17s) at the tightest gap the old tuning
  # already used without phrases crashing. Raise to 0.18–0.20 for more air
  # between voices, lower for a denser crowd.
  layer_gap_sec: 0.16
  # golden_gaps: stretch each gap by a random 0–15% per trigger so the
  # timing never sounds quantized. 0 = exact two-gap pattern.
  layer_gap_jitter: 0.15
  # phi_growth only. Tuning history:
  #   0.35 → 8th layer at 6.3s — too distant
  #   0.20 → 8th at 3.6s — but front gaps too tight (front phrases crash)
  #   0.28 → 8th at 5.0s — middle ground, PHI character preserved
  layer_delay_sec: 0.28
  # phi_growth only: floor between consecutive layer starts. 0 = pure PHI.
  layer_min_gap_sec: 0.0
  # Stereo width of the chorus: the oldest pair of voices sits at ±pan_width,
  # younger pairs proportionally closer to center, newest dead center.
  # Was effectively 0.9 with five of eight voices piled on the hard edges;
  # 0.6 keeps some left/right separation while the crowd reads as one group.
  # 0 = everything centered.
  pan_width: 0.6
  # 0.65 → 0.78: with 12 layers, 0.65^11 ≈ 0.009 (oldest inaudible). 0.78^11
  # ≈ 0.07 — older voices stay perceivable in the chorus while newest still
  # leads. Drop back to 0.65-0.70 if the mix becomes muddy.
  layer_volume_decay: 0.90
  # Per-clip loudness normalization at layering time. The clip enhancer
  # targets RMS 0.10 at save, but the actual on-disk RMS still varies
  # (0.04–0.14 across the pool). Re-normalising here ensures the
  # volume_decay falls off smoothly regardless of mic-distance / recording
  # level. `max_gain` caps how much we'll boost a quiet clip so noise
  # doesn't get amplified into the chorus.
  layer_norm_target_rms: 0.10
  layer_norm_max_gain: 3.0
  # Loudness target for the FINAL chorus mix (RMS). Replaces the old
  # peak-normalize, which divided the whole mix by its single loudest sample
  # and made chorus loudness jump trigger-to-trigger. RMS-normalizing keeps
  # the chorus body constant; the master brickwall (playback.master_ceiling)
  # remains the sole peak ceiling. Raise for a louder chorus, lower if the
  # limiter is working too hard. 0 disables mix normalization entirely.
  layer_mix_target_rms: 0.12
  detune_cents: 7.0
  lp_oldest_hz: 5500
  lp_newest_hz: 8000
  transient_soften_ms: 20
  fade_in_sec: 0.1
  fade_out_sec: 0.3
  reverb_enabled: true
  reverb_decay: 0.3
  reverb_delay_ms: 60
  # Per-layer reverb depth (one shared "room", per-voice distance).
  # Each layer gets its own send into the shared reverb bus:
  #   newest voice → long pre-delay + low wet ratio  → reads as CLOSE
  #   oldest voice → short pre-delay + high wet ratio → reads as DEEP
  # Matches real room acoustics and compounds with lp_oldest_hz darkening
  # and layer_volume_decay. Set false to revert to the flat shared reverb.
  reverb_per_layer: true
  reverb_wet_newest: 0.12       # wet send gain for the newest (front) voice
  reverb_wet_oldest: 0.30       # wet send gain for the oldest (deepest) voice
  reverb_predelay_newest_ms: 50 # reflections lag the front voice by this much
  reverb_predelay_oldest_ms: 10 # deepest voice: reverb arrives almost with it

# WLED — HTTP path (presets)
wled:
  host: "http://wled.local"
  timeout_sec: 2
  presets:
    idle: 1
    wake_neutral: 2
    intimate_low_volume: 3
    layered_high_volume: 4
    reject_or_unclear: 5
    fade_out: 6
  reactive:
    bri_min: 20
    bri_max: 255
    update_hz: 12
  # WLED realtime UDP (DRGB) — direct per-LED color, 60+ Hz
  realtime:
    enabled: true               # per-LED color from (valence, arousal); see modules/wled_udp.py:emotion_field
    host: "wled.local"        # WLED controller IP — no scheme
    port: 21324                 # DRGB UDP port
    num_leds: 210               # set to your strip length (probed from WLED-Gledopto on 2026-05-14)
    hold_timeout_s: 2
    # Frame rate for the reactive loop. WLED-Gledopto + 210 LEDs paints at
    # ~44 fps max regardless of input rate (probed 2026-05-14). 30 matches
    # comfortably and saves CPU + UDP traffic.
    update_hz: 30
    # Asleep indicator ("jetson sleep") — the strip breathes slowly in this
    # RGB color while listening is paused, so the sleep state is visible at
    # a glance. One inhale+exhale takes sleep_breath_s seconds.
    sleep_color: [20, 40, 140]    # deep blue
    sleep_breath_s: 6.0

# Vosk
vosk:
  model_path: "models/vosk-model-small-en-us-0.15"
  cooldown_sec: 3.0
  partial_confidence_min: 0.80  # confidence floor for a PARTIAL-result trigger. Matcher tiers: phonetic=0.80, slang=0.85, name_anchor(Sandy)=0.90, exact=1.0. 0.80 lets phonetic near-misses + Sandy fire on the streaming path again (0.92 blocked everything but a perfect exact match, which is why the wake stopped picking up). False positives from grammar-forced junk are handled by cross_validate below, not by this floor.
  final_confidence_min: 0.0     # confidence floor for a FINAL-result trigger. Finals are the reliable path and are already guarded by cross_validate; 0.0 = accept anything the matcher returns. Raise toward 0.80 only if honest finals start false-firing despite cross-validation.
  # Mute the wake detector while the speaker is playing AND for this many
  # seconds afterward — stops the chorus from re-triggering itself through
  # the mic. Tail covers room reverb + ALSA buffer drain. Raise if you still
  # hear feedback re-triggers; lower if it makes back-to-back triggers feel
  # sluggish.
  mute_cooldown_sec: 0.6
  # Defer partial-result triggers by this many seconds before firing them,
  # so a more specific (higher-priority) bucket can supersede if it appears
  # in the transcript within the window. Without this, "i love you"
  # (ily) fires before "sandy" arrives and the ily_sandy bucket loses its
  # turn. Final results bypass the wait. Lower = snappier ily, but more
  # likely to mis-route Sandy/etc.
  defer_partial_sec: 0.6
  # Cross-validation against a parallel FULL-VOCAB recognizer. Grammar mode
  # biases Kaldi toward our known wake phrases, so random speech ("have
  # you", "i'm a rectangle") gets transcribed as the closest wake phrase
  # at conf=1.0 — that's the looseness people hear. The full-vocab pass
  # transcribes whatever was actually said; if its recent transcript
  # doesn't contain ANY wake anchor (love-word or a bucket anchor_word),
  # we suppress the grammar trigger. Sandy still works because grammar
  # is allowed to disambiguate the BUCKET — we just require the love-word
  # to also show up in the honest transcript. Costs ~1x extra CPU on the
  # audio path (Vosk small is ~5% of one Orin CPU core, so still cheap).
  cross_validate:
    enabled: true
    # Drop the last full-vocab final result if older than this many seconds.
    # Prevents a fresh grammar hit from being validated against a stale
    # transcript captured before a long silence.
    staleness_sec: 4.0
    # Strict pair validation (2026-08-20). Anchor-only checking accepted ANY
    # word starting with lov/luv anywhere in the snapshot, so conversation
    # like "I'd love to…" / "lovely" validated grammar word-soup ("you too
    # love [unk]") and fired the chorus. With require_pair, love-family
    # triggers only validate when the honest transcript contains a love-word
    # IMMEDIATELY followed by an addressee token (you/u/ya/yeah/yew + any
    # anchor_extra name like sandy) or a slang token (ily). Real wake phrases
    # always transcribe with that adjacency, so recall is unaffected.
    # Monster/jetson buckets still validate on their own anchor word.
    # Set false to revert to any-anchor behaviour.
    require_pair: true

# Porcupine
porcupine:
  access_key: ""
  keyword_path: ""
  model_path: ""
  sensitivity: 0.5

# Clip enhancement — applied on save so playback is consistent across
# wildly different capture conditions (whispered, shouted, far/near).
# This runs ONCE per accepted clip during _stage_trim_and_resave, NOT
# during playback (the exciter chain below handles playback-time EQ).
enhancement:
  enabled: true
  # High-pass cutoff — removes rumble. 60Hz preserves vocal warmth.
  highpass_hz: 60
  # AC-mains hum notch — set 60 in US, 50 in EU, 0 to disable.
  hum_hz: 60
  hum_q: 30
  # Denoise: 0 = off, 1.0 = standard, up to 2.0 for noisy rooms.
  # Aggressive values produce "musical noise" artifacts; bump cautiously.
  denoise_strength: 1.4
  # Target RMS for loudness normalization (0.10 = ~-20 dBFS).
  # Layered clips balance because they're all hitting this level.
  target_rms: 0.10
  # Max gain applied during normalization. Caps lift on very quiet clips
  # so we don't amplify noise.
  max_gain_db: 18.0
  # Soft-knee compressor — tames peaks without flattening dynamics.
  comp_threshold: 0.5
  comp_ratio: 2.5
  # Light de-esser at the sibilance band.
  deess_freq_hz: 6500
  deess_threshold: 0.4

# Exciter / transducer conditioning
exciter:
  enabled: true
  highpass_hz: 180
  notch_hz: [1200]
  notch_q: 10
  lowpass_hz: 7000
  # Pre-limiter (BEFORE the master brickwall). Lower threshold + higher
  # ratio = peaks squashed early, body of signal less affected. The master
  # brickwall in playback.* is the absolute ceiling.
  limiter_threshold: 0.5
  limiter_ratio: 8.0

# Logging
logging:
  level: INFO
  file: logs/mirror.log

# Dry-run / test mode
test_mode: false
